<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111F">
  <meta name="description" content="Tableau de bord d'analyse, statistiques et surveillance pour votre serveur Jellyfin.">
  <title>JellyTrack</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/chart.min.js"></script>
</head>
<body>
  <div id="app-root">
    <!-- Collapsible / Mobile Responsive Sidebar -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="/" class="brand-link" data-link>
          <img src="/assets/logo.svg" alt="JellyTrack" class="brand-logo">
          <span class="brand-title">JellyTrack</span>
        </a>
      </div>

      <div class="sidebar-scroll">
        <div class="sidebar-search-box">
          <button class="sidebar-search-trigger" id="sidebar-search-trigger" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span data-i18n="common.search">Rechercher...</span>
            <kbd class="search-kbd">/</kbd>
          </button>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-list">
            <li class="nav-item" data-route="/">
              <a href="/" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span data-i18n="nav.dashboard">Tableau de bord</span>
              </a>
            </li>
            <li class="nav-item" data-route="/recent">
              <a href="/recent" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
                <span data-i18n="nav.recentlyAdded">Récents</span>
              </a>
            </li>
            <li class="nav-item" data-route="/media">
              <a href="/media" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/></svg>
                <span data-i18n="nav.library">Catalogue</span>
              </a>
            </li>
            <li class="nav-item" data-route="/users">
              <a href="/users" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span data-i18n="nav.users">Utilisateurs</span>
              </a>
            </li>
            <li class="nav-item" data-route="/admin/health">
              <a href="/admin/health" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 11l6.92 3-3.96 4"/></svg>
                <span data-i18n="nav.logHealth">Santé Système</span>
              </a>
            </li>
            <li class="nav-item" data-route="/logs">
              <a href="/logs" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/></svg>
                <span data-i18n="nav.logs">Logs</span>
              </a>
            </li>
            <li class="nav-item" data-route="/settings">
              <a href="/settings" data-link>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span data-i18n="nav.settings">Paramètres</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="user-controls-row">
          <div class="user-badge-mini" id="sidebar-user-badge">
            <div class="user-avatar-mini" id="sidebar-user-avatar">AD</div>
            <span class="user-name-mini" id="sidebar-user-name">admin</span>
          </div>

          <div class="sidebar-footer-actions">
            <!-- Theme Toggle -->
            <button class="btn btn-icon btn-sm btn-footer-action" id="btn-theme-toggle" title="Thème clair/sombre" aria-label="Basculer le thème">
              <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>

            <!-- Logout -->
            <button class="btn btn-icon btn-sm btn-footer-action" id="btn-logout" title="Déconnexion" aria-label="Se déconnecter">
              <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>

        <!-- Language Selector -->
        <select class="form-select sidebar-lang-select" id="select-language" aria-label="Langue">
          <option value="fr">Français (FR)</option>
          <option value="en">English (EN)</option>
          <option value="de">Deutsch (DE)</option>
          <option value="es">Español (ES)</option>
          <option value="it">Italiano (IT)</option>
          <option value="nl">Nederlands (NL)</option>
          <option value="pl">Polski (PL)</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="ru">Русский (RU)</option>
          <option value="zh">中文 (ZH)</option>
        </select>

        <div class="sidebar-version-wrap">
          <a href="/about" data-link class="sidebar-version-link">JellyTrack v2.1.1</a>
        </div>
      </div>
    </aside>

    <!-- Main Container Layout -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu mobile">
            <svg class="topbar-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <button class="search-trigger-btn" id="search-trigger-btn" type="button">
            <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span data-i18n="common.search">Rechercher médias, utilisateurs...</span>
            <span class="search-shortcut">/</span>
          </button>
        </div>

        <div class="topbar-right">
          <!-- Active Streams Pill -->
          <div class="live-streams-pill" id="topbar-live-streams-pill" title="Flux en direct">
            <span class="pulse-dot"></span>
            <span id="topbar-live-streams-count">0</span>
            <span data-i18n="dashboard.streams">flux</span>
          </div>

          <!-- Quick Sync Button -->
          <button class="btn btn-secondary btn-sm" id="btn-quick-sync" title="Synchroniser Jellyfin">
            <svg class="sync-icon" id="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span data-i18n="common.sync">Sync</span>
          </button>
        </div>
      </header>

      <!-- Router Viewport Outlet -->
      <main id="app-main" role="main">
        <!-- Rendered dynamically by app.js router -->
      </main>
    </div>
  </div>

  <!-- Global Quick Search Modal -->
  <div class="modal-backdrop" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="search-modal-title" data-i18n="search.title">Recherche Rapide</h2>
        <button class="btn btn-icon btn-sm" id="search-modal-close" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-input" id="search-modal-input" placeholder="Tapez un titre de film, série, artiste ou utilisateur..." autofocus autocomplete="off">
        <div id="search-modal-results" class="search-modal-results-list">
          <!-- Live results populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <!-- Global Action Modal (Kill stream, confirmations, forms) -->
  <div class="modal-backdrop" id="action-modal" role="dialog" aria-modal="true" aria-labelledby="action-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="action-modal-title">Titre</h2>
        <button class="btn btn-icon btn-sm" id="action-modal-close" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body" id="action-modal-body">
        <!-- Dynamic content -->
      </div>
      <div class="modal-footer" id="action-modal-footer">
        <button class="btn btn-secondary" id="action-modal-cancel">Annuler</button>
        <button class="btn btn-primary" id="action-modal-confirm">Confirmer</button>
      </div>
    </div>
  </div>

  <!-- Floating Toast Notifications Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Main Vanilla JS Client Application -->
  <script src="/assets/app.js"></script>
</body>
</html>
