name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  sveltekit:
    name: SvelteKit checks and presentation parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --production
      - run: npm run test:browser -- --production --smoke
      - run: npm run test:browser -- --production --sidebar
      - run: npm run test:login -- --production
      - run: npm run test:login -- --production --contracts
      - run: npm run test:dashboard -- --production --widgets
      - run: npm run test:backups
      - run: npm run test:accounts
      - run: npm run test:users
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install Pillow==12.2.0
      - run: python3 scripts/compare-dashboard-pixels.py --widgets
      - run: python3 scripts/compare-page-pixels.py backups
      - run: python3 scripts/compare-page-pixels.py accounts
      - run: python3 scripts/compare-page-pixels.py users
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build the embedded frontend integration server
        run: |
          mkdir -p ../scratch/frontend-integration-qa
          go build -o ../scratch/frontend-integration-qa/jellytrack ../cmd/jellytrack
      - run: npm run test:integration
      - name: Preserve frontend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sveltekit-parity
          path: scratch/frontend-sveltekit-*
          retention-days: 30

  go-test-and-vet:
    name: Go Tests & Vet
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-local-disposable
          POSTGRES_DB: jellytrack_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JELLYTRACK_TEST_POSTGRES_URL: postgresql://qa:qa-local-disposable@127.0.0.1:5432/jellytrack_qa?sslmode=disable
      JELLYTRACK_MULTI_TEST_PG_URL: postgresql://qa:qa-local-disposable@127.0.0.1:5432/jellytrack_multi_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend from its canonical sources
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Create isolated multi-server test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U qa jellytrack_multi_test

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binaries
        run: |
          go build -v .
          go build -v ./cmd/jellytrack

  browser-security:
    name: Account association and private Wrapped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile the frontend used by the browser security workflow
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Build disposable QA server
        run: |
          mkdir -p scratch/security-qa
          go build -o scratch/security-qa/jellytrack ./cmd/jellytrack
      - name: Install browser QA runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/jellytrack-qa" --no-save playwright@1.62.1
          "$RUNNER_TEMP/jellytrack-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise two-server browser workflow
        env:
          NODE_PATH: ${{ runner.temp }}/jellytrack-qa/node_modules
          QA_BINARY: ${{ github.workspace }}/scratch/security-qa/jellytrack
          PYTHON: python3
        run: node scripts/security-qa/browser.cjs
      - name: Preserve visual QA outside Git
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: account-security-browser-qa
          path: |
            scratch/security-qa/*.png
            scratch/security-qa/browser-results.json
          retention-days: 30

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: jellytrack:test
