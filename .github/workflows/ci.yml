name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run i18n check
        run: pnpm run check:i18n

  test-suite:
    name: Vitest Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    env:
      CI: true
      SKIP_INSTRUMENTATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run unit & integration tests
        run: pnpm run test

  production-build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    env:
      CI: true
      SKIP_INSTRUMENTATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXTAUTH_SECRET: 'ci-secret-value-32-chars-long-string'
      JELLYFIN_API_KEY: 'ci-jellyfin-api-key'
      JELLYFIN_WEBHOOK_SECRET: 'ci-webhook-secret'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build Next.js application
        run: pnpm run build

  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [production-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: jellytrack:ci-test

      - name: Run container & verify healthcheck
        run: |
          echo "Starting JellyTrack test container..."
          docker run -d --name jellytrack-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXTAUTH_SECRET="ci-secret-value-32-chars-long-string" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e JELLYFIN_API_KEY="ci-jellyfin-api-key" \
            -e JELLYFIN_WEBHOOK_SECRET="ci-webhook-secret" \
            -e POSTGRES_PASSWORD="ci-test-password" \
            -e PRISMA_USE_STUB=true \
            jellytrack:ci-test

          echo "Waiting for container startup..."
          sleep 12

          echo "Checking container logs..."
          docker logs jellytrack-test

          echo "Checking HTTP login page (200 OK verification)..."
          curl -f --retry 10 --retry-delay 3 --retry-all-errors --retry-connrefused http://localhost:3000/login || {
            echo "Smoke test failed! Full container logs:"
            docker logs jellytrack-test
            exit 1
          }

          echo "Checking HTTP API health JSON output..."
          curl -s --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health | grep -q "status" || {
            echo "API health test failed! Full container logs:"
            docker logs jellytrack-test
            exit 1
          }

          echo "Container passed smoke test successfully!"
          docker stop jellytrack-test
          docker rm jellytrack-test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --prod --audit-level=critical
