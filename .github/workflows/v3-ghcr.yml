name: Build and publish JellyTrack v3

on:
  push:
    branches: [main]
    tags: ["v3-*"]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ghcr.yml"
  pull_request:
    branches: [main]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Prepare image tags
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/maelmoreau21/jellytrack
          tags: |
            type=raw,value=v3-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr,prefix=v3-pr-

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: v3/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v3-')) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=v3
          cache-to: type=gha,mode=max,scope=v3
