services:
  jellytrack:
    image: ghcr.io/maelmoreau21/jellytrack:v3-latest
    build:
      context: ..
      dockerfile: v3/Dockerfile
    container_name: jellytrack-v3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${JELLYTRACK_PORT:-${PORT:-3000}}
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: ${GOMEMLIMIT:-32MiB}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-}
      DATABASE_PATH: ${DATABASE_PATH:-/data/jellytrack.db}
      DATABASE_URL: ${DATABASE_URL:-}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      ENABLE_PPROF: ${ENABLE_PPROF:-false}
    ports:
      - "${APP_PORT:-3000}:${JELLYTRACK_PORT:-${PORT:-3000}}"
    volumes:
      - jellytrack_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/jellytrack", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  jellytrack_data:
